name: "NSE Whole-Market S2 Shadow (Non-ETF)"

concurrency:
  group: shadow-nse-s2
  cancel-in-progress: false

on:
  schedule:
    # 16:32 IST (11:02 UTC) Monday-Friday post-NSE close (isolated from Gate B state branch)
    - cron: '02 11 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass session idempotency guard'
        required: false
        default: false
        type: boolean

jobs:
  nse-s2-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: "Checkout Repository (main branch)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests python-dotenv pydantic pydantic-settings

      - name: "Restore NSE S2 Shadow State from state-shadow-nse Branch"
        run: |
          mkdir -p trading_system/data
          git fetch origin +refs/heads/state-shadow-nse:refs/remotes/origin/state-shadow-nse 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/state-shadow-nse; then
            for f in \
              trading_system/data/nse_s2_shadow_state.json \
              trading_system/data/nse_s2_shadow_trades.csv \
              trading_system/data/nse_s2_shadow_equity_log.csv \
              trading_system/data/nse_s2_shadow_fidelity.csv; do
              git checkout origin/state-shadow-nse -- "$f" 2>/dev/null && echo "  Restored $f" || echo "  $f initializing fresh"
            done
          fi

      - name: "Run NSE S2 Shadow Daily Cycle"
        env:
          PYTHONPATH: .
          ENABLE_NOTIFICATIONS: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python trading_system/scripts/run_nse_s2_shadow.py $FORCE_ARG

      - name: "Run Weekly Shadow Fidelity Replay (Fridays)"
        env:
          PYTHONPATH: .
        run: |
          if [ "$(date -u +%u)" = "5" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            python trading_system/scripts/run_nse_s2_shadow_replay.py
          else
            echo "Not Friday; skipping weekly shadow replay."
          fi

      - name: "Persist NSE S2 Shadow State to state-shadow-nse Branch"
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/nse_shadow_repo
          if git clone --depth 1 --branch state-shadow-nse https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/nse_shadow_repo 2>/dev/null; then
            echo "Cloned existing state-shadow-nse branch."
          else
            cd /tmp/nse_shadow_repo
            git init
            git checkout -b state-shadow-nse
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            cd -
          fi
          mkdir -p /tmp/nse_shadow_repo/trading_system/data
          for f in \
            trading_system/data/nse_s2_shadow_state.json \
            trading_system/data/nse_s2_shadow_trades.csv \
            trading_system/data/nse_s2_shadow_equity_log.csv \
            trading_system/data/nse_s2_shadow_fidelity.csv; do
            [ -f "$f" ] && cp "$f" /tmp/nse_shadow_repo/trading_system/data/
          done
          cd /tmp/nse_shadow_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system/data/nse_s2_shadow_* 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(shadow-nse-s2): persist daily NSE S2 non-ETF shadow state [skip ci]"
            git push -u origin state-shadow-nse
          else
            echo "No NSE S2 shadow state changes."
          fi
