name: "US Forward Shadow Paper Trading (Alpaca - Zero Capital)"

# ==============================================================================
# Autonomous US Forward Shadow Trader (Wide-Trend Runner on Alpaca Paper Desk)
#
# Isolated Operational Contract:
# 1. Runs strictly after US market close (16:15 EST / 21:15 UTC Monday-Friday).
# 2. Concurrency group is 'shadow-us-alpaca' - NEVER shares 'trading-state',
#    guaranteeing ZERO collision or cancellation with the Indian Gate B pipeline.
# 3. State persistence targets 'state-shadow-us' branch ONLY - completely isolated
#    from the production 'state' branch and frozen 'main'.
# 4. Zero fund capital ($0 allocated from Central Portfolio Manager).
# ==============================================================================

concurrency:
  group: shadow-us-alpaca
  cancel-in-progress: false

on:
  schedule:
    # 09:30 EST (14:30 UTC) Monday through Friday - US Market Open Execution
    - cron: '30 14 * * 1-5'
    # 16:15 EST (21:15 UTC) Monday through Friday - US Market Close Scan & Queueing
    - cron: '15 21 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Execution Phase'
        required: true
        default: 'scan'
        type: choice
        options:
          - scan
          - execute
          - status
      force:
        description: 'Bypass market timing guard (manual force run)'
        required: false
        default: false
        type: boolean

jobs:
  us-shadow-trader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: "Checkout Repository (main branch)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests python-dotenv

      - name: "Restore US Shadow State Artifacts from state-shadow-us Branch"
        run: |
          mkdir -p trading_system/data
          git fetch origin +refs/heads/state-shadow-us:refs/remotes/origin/state-shadow-us 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/state-shadow-us; then
            echo "Restoring US shadow artifacts from state-shadow-us branch..."
            for f in \
              trading_system/data/paper_state_us.json \
              trading_system/data/paper_trades_us.csv \
              trading_system/data/paper_equity_log.csv; do
              git checkout origin/state-shadow-us -- "$f" 2>/dev/null && echo "  Restored $f" || echo "  $f not found on shadow branch (initializing fresh)"
            done
            echo "Shadow state restoration complete."
          else
            echo "No state-shadow-us branch found; initializing fresh shadow tracking."
          fi

      - name: "Execute US Shadow Trading Routine (Alpaca Paper Desk)"
        env:
          PYTHONPATH: .
          PAPER_API_KEY: ${{ secrets.PAPER_API_KEY }}
          PAPER_API_SECRET: ${{ secrets.PAPER_API_SECRET }}
          ENABLE_NOTIFICATIONS: "0"
        run: |
          if [ -n "${{ github.event.inputs.phase }}" ]; then
            PHASE="${{ github.event.inputs.phase }}"
          elif [ "${{ github.event.schedule }}" = "30 14 * * 1-5" ]; then
            PHASE="execute"
          else
            PHASE="scan"
          fi
          echo "================================================================"
          echo ">>> EXECUTING US SHADOW PAPER TRADER (PHASE: $PHASE) <<<"
          echo "================================================================"
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python trading_system/scripts/run_dual_pod_paper.py --pod us --phase "$PHASE" --mode exploratory_shadow $FORCE_ARG

      - name: "Persist US Shadow State Artifacts to state-shadow-us Branch"
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Staging US shadow state into isolated workspace..."
          mkdir -p /tmp/shadow_repo
          if git clone --depth 1 --branch state-shadow-us https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/shadow_repo 2>/dev/null; then
            echo "Successfully cloned existing state-shadow-us branch."
          else
            echo "Initializing fresh state-shadow-us branch workspace..."
            cd /tmp/shadow_repo
            git init
            git checkout -b state-shadow-us
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            cd -
          fi

          mkdir -p /tmp/shadow_repo/trading_system/data
          for f in \
            trading_system/data/paper_state_us.json \
            trading_system/data/paper_trades_us.csv \
            trading_system/data/paper_equity_log.csv; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/shadow_repo/trading_system/data/
            fi
          done

          cd /tmp/shadow_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system/data/paper_* 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore(shadow-us): persist daily US forward paper trading state [skip ci]"
            git pull --rebase origin state-shadow-us 2>/dev/null || true
            git push origin state-shadow-us
            echo "US Shadow state persistence complete."
          else
            echo "No US shadow state changes to commit."
          fi
