name: V2 Weekend Quant Optimizer

on:
  # Automated schedule DEACTIVATED by user directive.
  # schedule:
  #   # Runs at 12:00 UTC every Saturday
  #   - cron: '0 12 * * 6'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Walk-Forward Optimizer (Diagnostic Audit Only)
        run: |
          PYTHONPATH=. python trading_system/scripts/weekend_optimizer.py

      - name: Verify Live Configurations Untouched
        run: |
          git status --porcelain trading_system/app/config/markets/
          test -z "$(git status --porcelain trading_system/app/config/markets/)" || (echo "FATAL: Live market configs were altered!" && exit 1)

      - name: Upload Diagnostic Report & Candidate Staging Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekend-optimizer-report
          path: |
            WEEKEND_OPTIMIZER_REPORT.md
            trading_system/app/config/candidate_params.json
