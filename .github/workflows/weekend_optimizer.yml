name: V2 Weekend Quant Optimizer

on:
  schedule:
    # Runs at 12:00 UTC every Saturday
    - cron: '0 12 * * 6'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Walk-Forward Optimizer
        run: |
          PYTHONPATH=. python trading_system/scripts/weekend_optimizer.py
          
      - name: Commit Optimized Parameters
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system/app/config/dynamic_params.json
          git commit -m "Automated Walk-Forward Optimization: Updated SMAs for new market regime" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push
