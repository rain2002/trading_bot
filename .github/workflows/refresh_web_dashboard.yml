name: "Refresh Live Web Dashboard"

concurrency:
  group: web-dashboard-refresh
  cancel-in-progress: true

on:
  workflow_run:
    workflows:
      - "Daily Multi-Bot Paper Trading Pipeline"
      - "US Shadow Scan (Post-Close & Overnight)"
      - "US Shadow Execute (Market Open)"
      - "NSE Whole-Market S2 Shadow (Non-ETF)"
    types:
      - completed
  workflow_dispatch:

jobs:
  refresh-dashboard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: "Checkout Repository (main branch)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Fetch Latest State Branches"
        run: |
          git fetch origin +refs/heads/state:refs/remotes/origin/state 2>/dev/null || true
          git fetch origin +refs/heads/state-shadow-us:refs/remotes/origin/state-shadow-us 2>/dev/null || true
          git fetch origin +refs/heads/state-shadow-nse:refs/remotes/origin/state-shadow-nse 2>/dev/null || true

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Minimal Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance

      - name: "Regenerate docs/index.html"
        env:
          PYTHONPATH: .
        run: |
          python trading_system/scripts/generate_web_dashboard.py

      - name: "Commit & Push Updated Web Dashboard"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "build(docs): auto-refresh live telemetry dashboard [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main || true
              git push origin main && break
              sleep 2
            done
          else
            echo "Dashboard HTML already up to date."
          fi
