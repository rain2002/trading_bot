name: Dual-Pod Autonomous Cloud Trader (India & US)

on:
  schedule:
    # 03:46 UTC = 09:16 IST (Mon-Fri) - India Market Open Execution
    - cron: '46 3 * * 1-5'
    # 06:30 UTC = 12:00 IST (Mon-Fri) - India Mid-Session Status & Health Check
    - cron: '30 6 * * 1-5'
    # 10:05 UTC = 15:35 IST (Mon-Fri) - India Market Close Scan
    - cron: '5 10 * * 1-5'
    # 14:31 UTC = 09:31 EST / 10:31 EDT (Mon-Fri) - US Market Open Execution
    - cron: '31 14 * * 1-5'
    # 18:00 UTC = 13:00 EST / 14:00 EDT (Mon-Fri) - US Mid-Session Status & Health Check
    - cron: '0 18 * * 1-5'
    # 21:05 UTC = 16:05 EST / 17:05 EDT (Mon-Fri) - US Market Close Scan
    - cron: '5 21 * * 1-5'

  workflow_dispatch:
    inputs:
      target:
        description: 'Target Routine to Execute'
        required: true
        default: 'AUTO'
        type: choice
        options:
          - AUTO
          - INDIA_EXECUTE
          - INDIA_MIDDAY
          - INDIA_SCAN
          - US_EXECUTE
          - US_MIDDAY
          - US_SCAN
          - REGENERATE_DASHBOARD

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trading-state
  cancel-in-progress: false

jobs:
  run-trader:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Quant Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enforce Fiduciary Credential Guard (CI Safety)
        run: |
          python trading_system/scripts/check_no_real_credentials_or_accounts.py --all

      - name: Determine Market Phase
        id: determine_phase
        run: |
          TARGET="${{ github.event.inputs.target }}"
          CRON="${{ github.event.schedule }}"

          if [ "$TARGET" = "INDIA_EXECUTE" ] || [ "$CRON" = "46 3 * * 1-5" ]; then
            echo "PHASE=execute" >> $GITHUB_ENV
            echo "POD=india" >> $GITHUB_ENV
          elif [ "$TARGET" = "INDIA_MIDDAY" ] || [ "$CRON" = "30 6 * * 1-5" ]; then
            echo "PHASE=status" >> $GITHUB_ENV
            echo "POD=india" >> $GITHUB_ENV
          elif [ "$TARGET" = "INDIA_SCAN" ] || [ "$CRON" = "5 10 * * 1-5" ]; then
            echo "PHASE=scan" >> $GITHUB_ENV
            echo "POD=india" >> $GITHUB_ENV
          elif [ "$TARGET" = "US_EXECUTE" ] || [ "$CRON" = "31 14 * * 1-5" ]; then
            echo "PHASE=execute" >> $GITHUB_ENV
            echo "POD=us" >> $GITHUB_ENV
          elif [ "$TARGET" = "US_MIDDAY" ] || [ "$CRON" = "0 18 * * 1-5" ]; then
            echo "PHASE=status" >> $GITHUB_ENV
            echo "POD=us" >> $GITHUB_ENV
          elif [ "$TARGET" = "US_SCAN" ] || [ "$CRON" = "5 21 * * 1-5" ]; then
            echo "PHASE=scan" >> $GITHUB_ENV
            echo "POD=us" >> $GITHUB_ENV
          elif [ "$TARGET" = "REGENERATE_DASHBOARD" ]; then
            echo "PHASE=dashboard_only" >> $GITHUB_ENV
            echo "POD=none" >> $GITHUB_ENV
          else
            # AUTO dispatch: detect which market is active by UTC hour
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 3 ] && [ "$HOUR" -lt 11 ]; then
              echo "PHASE=scan" >> $GITHUB_ENV
              echo "POD=india" >> $GITHUB_ENV
            elif [ "$HOUR" -ge 14 ] && [ "$HOUR" -lt 22 ]; then
              echo "PHASE=scan" >> $GITHUB_ENV
              echo "POD=us" >> $GITHUB_ENV
            else
              echo "PHASE=status" >> $GITHUB_ENV
              echo "POD=all" >> $GITHUB_ENV
            fi
          fi

      - name: Restore Fiduciary State Artifacts from State Branch
        run: |
          git fetch origin +refs/heads/state:refs/remotes/origin/state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/state; then
            echo "Restoring latest state files from origin/state branch..."
            git checkout origin/state -- trading_system/data/paper_state_india.json trading_system/data/paper_state_us.json trading_system/data/paper_state_multi_asset.json trading_system/data/paper_equity_log.csv trading_system/data/paper_trades_india.csv trading_system/data/paper_trades_us.csv trading_system/data/paper_trades_multi_asset.csv 2>/dev/null || true
          else
            echo "No origin/state branch found; using local repository state defaults."
          fi

      - name: Execute Dual-Pod Quant Engine
        env:
          GATE_A_SIGNING_KEY: ${{ secrets.GATE_A_SIGNING_KEY }}
          PAPER_API_KEY: ${{ secrets.PAPER_API_KEY || secrets.ALPACA_API_KEY || secrets.ALPACA_PAPER_KEY }}
          PAPER_API_SECRET: ${{ secrets.PAPER_API_SECRET || secrets.ALPACA_SECRET_KEY || secrets.ALPACA_PAPER_SECRET }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.PAPER_API_KEY || secrets.ALPACA_PAPER_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.PAPER_API_SECRET || secrets.ALPACA_PAPER_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALPACA_LIVE: "0"
          GROWW_FALLBACK_ACTIVE: "1"
        run: |
          if [ "$PHASE" = "dashboard_only" ]; then
            echo ">>> Regenerating Static Web Dashboard..."
            python trading_system/scripts/generate_web_dashboard.py
          else
            echo ">>> Running Dual-Pod Routine: Phase=$PHASE, Pod=$POD"
            python trading_system/scripts/run_dual_pod_paper.py --phase "$PHASE" --pod "$POD"
            if [ "$POD" = "india" ]; then
              echo ">>> Running Pod C Multi-Asset Trend Routine alongside India Market..."
              python trading_system/scripts/run_dual_pod_paper.py --phase "$PHASE" --pod pod_c
            fi
          fi

      - name: Persist Telemetry & State Artifacts to Dedicated State Branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone state branch into an isolated temporary workspace
          mkdir -p /tmp/state_repo
          if git clone --depth 1 --branch state https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/state_repo 2>/dev/null; then
            echo "Successfully cloned existing state branch."
          else
            echo "Initializing fresh state branch workspace..."
            cd /tmp/state_repo
            git init
            git checkout -b state
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            cd -
          fi

          # Copy telemetry and state artifacts into the state workspace
          mkdir -p /tmp/state_repo/trading_system/data /tmp/state_repo/docs
          cp trading_system/data/paper_* /tmp/state_repo/trading_system/data/ 2>/dev/null || true
          cp docs/index.html /tmp/state_repo/docs/ 2>/dev/null || true

          # Commit and push from the clean state workspace
          cd /tmp/state_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system/data/paper_* docs/index.html 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): update live paper trading state & dashboard [skip ci]"
            # Rebase to absorb concurrent commits conflict-free
            git pull --rebase origin state 2>/dev/null || true
            git push origin state
          else
            echo "No changes in paper trading state or dashboard; state is up to date."
          fi
