name: V2 Daily Paper Trading Engine

on:
  schedule:
    # Runs at 19:30 UTC every weekday (Mon-Fri)
    # This is 3:30 PM EST / 12:30 PM PST
    - cron: '30 19 * * 1-5'
  
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    
    # Map GitHub Secrets directly to the Python environment
    env:
      PAPER_API_KEY: ${{ secrets.PAPER_API_KEY }}
      PAPER_API_SECRET: ${{ secrets.PAPER_API_SECRET }}
      # We default to an ephemeral SQLite DB since the bot syncs state from Alpaca
      DATABASE_URL: sqlite:///trading_db.sqlite 
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip' # Caches dependencies to make the run faster

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V2 LLM Brain Engine
        run: |
          python trading_system/scripts/run_llm_bot.py
