name: V2 Daily Paper Trading Engine

concurrency:
  group: trading-bot-execution
  cancel-in-progress: false

on:
  schedule:
    # Runs at 19:35 UTC every weekday (Mon-Fri)
    # Off-peak minute avoids GitHub Actions queue dropouts at :00 and :30
    # 19:35 UTC = 3:35 PM EDT / 2:35 PM CDT
    - cron: '35 19 * * 1-5'
  
  # Allow manual triggering from the GitHub Actions tab
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    
    # Map GitHub Secrets directly to the Python environment
    env:
      PAPER_API_KEY: ${{ secrets.PAPER_API_KEY }}
      PAPER_API_SECRET: ${{ secrets.PAPER_API_SECRET }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Ephemeral SQLite DB since state is sourced directly from Alpaca and position tracker
      DATABASE_URL: sqlite:///trading_db.sqlite 
      PYTHONPATH: .

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V2 Quant Brain Engine
        run: |
          python trading_system/scripts/run_quant_bot.py

      - name: Workflow Failure Alert Notification
        if: failure()
        run: |
          python -c "
          import os, requests
          webhook = os.getenv('DISCORD_WEBHOOK_URL')
          tg_token = os.getenv('TELEGRAM_BOT_TOKEN')
          tg_chat = os.getenv('TELEGRAM_CHAT_ID')
          msg = '🚨 CRITICAL ALERT: Daily Trading Bot workflow run failed in GitHub Actions!'
          if webhook:
              try: requests.post(webhook, json={'content': msg}, timeout=10)
              except: pass
          if tg_token and tg_chat:
              try: requests.post(f'https://api.telegram.org/bot{tg_token}/sendMessage', json={'chat_id': tg_chat, 'text': msg}, timeout=10)
              except: pass
          "
