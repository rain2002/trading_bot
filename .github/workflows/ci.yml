name: Continuous Integration & Security Guard

on:
  push:
    branches: [ main, master, feat/*, fix/* ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-mock

      - name: Run Credential & Account ID Guard
        run: |
          python trading_system/scripts/check_no_real_credentials_or_accounts.py --all

      - name: Run Unit Test Suite
        run: |
          pytest trading_system/tests/unit/ -v --tb=short
