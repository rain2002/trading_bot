name: "US Shadow Scan (Post-Close & Overnight)"

# ==============================================================================
# Isolated Workflow for US Shadow Close Signal Scanning (Variant 1 Exploratory)
# Separated from Execution so GitHub cron lag on one phase never blocks the other.
# Uses staggered cron triggers + session bar-date idempotency to survive GitHub's
# 5-11 hour cron dispatch backlog cleanly.
# ==============================================================================

concurrency:
  group: shadow-us-scan
  cancel-in-progress: false

on:
  schedule:
    # With +5h to +11h GitHub cron lag, lands 21:18-03:18 UTC (16:18-22:18 EST post-close)
    - cron: '18 16 * * 1-5'
    # Primary post-close trigger (16:18 EST if on time, overnight if delayed)
    - cron: '18 21 * * 1-5'
    # Overnight catch-up (23:18 EST prior close; with up to +9h lag still finishes before 09:25 EST open)
    - cron: '18 04 * * 2-6'
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass market timing guard (manual force run)'
        required: false
        default: false
        type: boolean

jobs:
  us-shadow-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: "Checkout Repository (main branch)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests python-dotenv

      - name: "Restore US Shadow State Artifacts from state-shadow-us Branch"
        run: |
          mkdir -p trading_system/data
          git fetch origin +refs/heads/state-shadow-us:refs/remotes/origin/state-shadow-us 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/state-shadow-us; then
            for f in \
              trading_system/data/paper_state_us.json \
              trading_system/data/paper_trades_us.csv \
              trading_system/data/paper_equity_log.csv; do
              git checkout origin/state-shadow-us -- "$f" 2>/dev/null && echo "  Restored $f" || echo "  $f not found"
            done
          fi

      - name: "Execute US Shadow Scan Phase"
        env:
          PYTHONPATH: .
          PAPER_API_KEY: ${{ secrets.PAPER_API_KEY }}
          PAPER_API_SECRET: ${{ secrets.PAPER_API_SECRET }}
          ENABLE_NOTIFICATIONS: "0"
        run: |
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python trading_system/scripts/run_dual_pod_paper.py --pod us --phase scan --mode exploratory_shadow $FORCE_ARG

      - name: "Persist US Shadow State Artifacts to state-shadow-us Branch"
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/shadow_repo
          git clone --depth 1 --branch state-shadow-us https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/shadow_repo
          mkdir -p /tmp/shadow_repo/trading_system/data
          for f in \
            trading_system/data/paper_state_us.json \
            trading_system/data/paper_trades_us.csv \
            trading_system/data/paper_equity_log.csv; do
            [ -f "$f" ] && cp "$f" /tmp/shadow_repo/trading_system/data/
          done
          cd /tmp/shadow_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trading_system/data/paper_* 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(shadow-us): persist daily US forward paper trading state [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin state-shadow-us 2>/dev/null || true
              git push origin state-shadow-us && break
              sleep 2
            done
          else
            echo "No US shadow state changes to commit."
          fi
