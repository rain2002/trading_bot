name: "Daily Multi-Bot Paper Trading Pipeline"

# ==============================================================================
# Unified Daily Execution Pipeline: ETF & Gold Bot -> Bond & Cash Bot -> Manager
# Runs strictly on NSE trading days after market close (16:13 IST / 10:43 UTC).
#
# Sequential Architecture:
# 1. Restores all bot and manager state files from origin/state branch.
# 2. Runs Bot 1 (ETF & Gold Bot - Phase 1 Champion).
# 3. Runs Bot 2 (Bond & Cash Bot - Phase 3 Champion B0).
#    * Retreat Lag Note: Bot 2 ingests the Manager's max_duration_scale from
#      the previous session's state (1-day EOD lag), standard for EOD paper trading.
# 4. Runs Central Portfolio Manager (Phase 2).
#    * Independently reconciles Bot 1 and Bot 2 NAVs against raw cash + positions.
#    * Updates unitized NAV ledger and lifetime high-water mark.
#    * Publishes updated max_duration_scale for next cycle.
# 5. Persists all state files atomically to the origin/state branch in a single commit.
#
# Concurrency is pinned to 'trading-state' to prevent any concurrent state writes.
# ==============================================================================

concurrency:
  group: trading-state
  cancel-in-progress: false

on:
  schedule:
    # 16:13 IST (10:43 UTC) Monday through Friday - uncrowded minute to minimize GitHub runner queue lag
    - cron: '43 10 * * 1-5'
  workflow_dispatch:

jobs:
  daily-paper-trading-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: "Checkout Repository (main branch)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy scipy requests python-dotenv pydantic pydantic-settings

      - name: "Restore Paper State Artifacts from State Branch"
        run: |
          mkdir -p trading_system/data
          git fetch origin +refs/heads/state:refs/remotes/origin/state 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/state; then
            echo "Restoring state files individually from origin/state branch..."
            for f in \
              trading_system/data/etf_gold_state.json \
              trading_system/data/etf_gold_trades.csv \
              trading_system/data/etf_gold_equity_log.csv \
              trading_system/data/bond_cash_state.json \
              trading_system/data/bond_cash_trades.csv \
              trading_system/data/bond_cash_equity_log.csv \
              trading_system/data/manager_state.json \
              trading_system/data/manager_equity_log.csv \
              trading_system/data/unitized_nav_ledger.json; do
              git checkout origin/state -- "$f" 2>/dev/null && echo "  Restored $f" || echo "  $f not on state branch yet (first-time initialization)"
            done
            echo "State restoration step complete."
          else
            echo "No origin/state branch found; initializing fresh incubation state."
          fi

      - name: "Step 1 - Execute Bot 1 (ETF & Gold Bot)"
        continue-on-error: true
        env:
          PYTHONPATH: .
          ENABLE_NOTIFICATIONS: "0"
        run: |
          echo "================================================================"
          echo ">>> PIPELINE STEP 1: EXECUTING BOT 1 (ETF & GOLD BOT) <<<"
          echo "================================================================"
          python trading_system/scripts/run_etf_gold_bot.py

      - name: "Step 2 - Execute Bot 2 (Bond & Cash Bot)"
        continue-on-error: true
        env:
          PYTHONPATH: .
          ENABLE_NOTIFICATIONS: "0"
        run: |
          echo "================================================================"
          echo ">>> PIPELINE STEP 2: EXECUTING BOT 2 (BOND & CASH BOT) <<<"
          echo "================================================================"
          # Ingests previous session's manager max_duration_scale (1-day EOD lag)
          python trading_system/scripts/run_bond_cash_bot.py

      - name: "Step 3 - Execute Central Portfolio Manager"
        env:
          PYTHONPATH: .
          ENABLE_NOTIFICATIONS: "1"
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          echo "================================================================"
          echo ">>> PIPELINE STEP 3: EXECUTING CENTRAL PORTFOLIO MANAGER <<<"
          echo "================================================================"
          # Independently reconciles Bot 1 and Bot 2, updates ledger, publishes max_duration_scale
          python trading_system/scripts/run_manager.py

      - name: "Step 4 - Persist All Paper State Artifacts to State Branch"
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Staging state files into isolated temporary workspace..."
          mkdir -p /tmp/state_repo
          if git clone --depth 1 --branch state https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/state_repo 2>/dev/null; then
            echo "Successfully cloned existing state branch."
          else
            echo "Initializing fresh state branch workspace..."
            cd /tmp/state_repo
            git init
            git checkout -b state
            git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            cd -
          fi

          mkdir -p /tmp/state_repo/trading_system/data
          for f in \
            trading_system/data/etf_gold_state.json \
            trading_system/data/etf_gold_trades.csv \
            trading_system/data/etf_gold_equity_log.csv \
            trading_system/data/bond_cash_state.json \
            trading_system/data/bond_cash_trades.csv \
            trading_system/data/bond_cash_equity_log.csv \
            trading_system/data/manager_state.json \
            trading_system/data/manager_equity_log.csv \
            trading_system/data/unitized_nav_ledger.json; do
            if [ -f "$f" ]; then
              cp "$f" /tmp/state_repo/trading_system/data/
            fi
          done

          cd /tmp/state_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            trading_system/data/etf_gold_state.json \
            trading_system/data/etf_gold_trades.csv \
            trading_system/data/etf_gold_equity_log.csv \
            trading_system/data/bond_cash_state.json \
            trading_system/data/bond_cash_trades.csv \
            trading_system/data/bond_cash_equity_log.csv \
            trading_system/data/manager_state.json \
            trading_system/data/manager_equity_log.csv \
            trading_system/data/unitized_nav_ledger.json 2>/dev/null || true

          if ! git diff --staged --quiet; then
            git commit -m "chore(state): persist daily multi-bot pipeline state [skip ci]"
            # Rebase to absorb concurrent commits conflict-free
            git pull --rebase origin state 2>/dev/null || true
            git push origin state
            echo "Pipeline state persistence complete."
          else
            echo "No state changes to commit."
          fi
