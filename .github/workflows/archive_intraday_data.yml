name: Archive Intraday NSE Data (Read-Only)

on:
  schedule:
    # 10:30 UTC = 16:00 IST (Mon-Fri after Indian market close)
    - cron: '30 10 * * 1-5'
  
  # Allow manual execution
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of trading days to archive'
        required: false
        default: '5'
      interval:
        description: 'Intraday bar resolution (e.g., 5m, 15m, 60m)'
        required: false
        default: '5m'

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Archiver
        run: |
          PYTHONPATH=. python trading_system/scripts/archive_intraday_data.py --days ${{ github.event.inputs.days || '5' }} --interval ${{ github.event.inputs.interval || '5m' }}

      - name: Upload Intraday Parquet Datasets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nse-intraday-parquet
          path: trading_system/data/historical/intraday/*.parquet
          if-no-files-found: warn
