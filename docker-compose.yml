version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: antigravity_db
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quantpassword
      POSTGRES_DB: trading_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
