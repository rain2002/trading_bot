[project]
name = "trading_system"
version = "0.1.0"
description = "Quantitative Trading Research and Execution Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "yfinance>=0.2.0",
    "html5lib>=1.1",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pandas-ta>=0.3.14b",
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "statsmodels>=0.14.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["trading_system/tests"]
python_files = ["test_*.py"]
